<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFC21A">
<title>DamDay — меню и заказ</title>
<style>
  :root {
    --yellow: #FFC21A;
    --orange: #FF8A00;
    --orange-dark: #E56F00;
    --ink: #1E1E1E;
    --ink-2: #5C5C5C;
    --bg: #FFF9EC;
    --card: #FFFFFF;
    --line: #F0E6CF;
    --green: #1F9D55;
    --wa: #25D366;
    --radius: 18px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative;
    padding-bottom: calc(110px + var(--safe-b)); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input, textarea { font: inherit; }

  /* Шапка */
  .hero { background: linear-gradient(160deg, var(--yellow) 0%, var(--orange) 100%); color: var(--ink);
    padding: 22px 16px 26px; border-radius: 0 0 28px 28px; position: relative; overflow: hidden; }
  .hero::after { content: "🍔"; position: absolute; right: -14px; top: 6px; font-size: 120px; opacity: .22; transform: rotate(-12deg); }
  .logo { font-size: 34px; font-weight: 900; letter-spacing: -.02em; margin: 0; }
  .logo span { color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.08); }
  .tagline { margin: 2px 0 14px; font-weight: 600; opacity: .85; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.85); border-radius: 999px;
    padding: 6px 12px; font-size: 14px; font-weight: 600; text-decoration: none; color: var(--ink); }
  .pill.open b { color: var(--green); }
  .pill.closed b { color: #C0392B; }
  .hero-actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px;
    border-radius: 14px; font-weight: 700; text-decoration: none; }
  .btn-dark { background: var(--ink); color: #fff; flex: 1; }
  .btn-light { background: #fff; color: var(--ink); flex: 1; }

  /* Акции */
  .section-title { font-size: 22px; font-weight: 800; margin: 22px 16px 10px; }
  .promos { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 4px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .promos::-webkit-scrollbar { display: none; }
  .promo { display: block; text-align: left; flex: 0 0 82%; scroll-snap-align: start; border-radius: var(--radius); padding: 16px; color: #fff; min-height: 128px;
    background: linear-gradient(135deg, var(--orange) 0%, #FF5A3C 100%); position: relative; overflow: hidden; }
  .promo:nth-child(2) { background: linear-gradient(135deg, #2D2D2D 0%, #4A3A1A 100%); }
  .promo .emoji { position: absolute; right: 10px; bottom: 4px; font-size: 64px; }
  .promo h3 { margin: 0 0 6px; font-size: 19px; line-height: 1.2; max-width: 75%; }
  .promo p { margin: 0 0 12px; opacity: .9; font-size: 14px; max-width: 70%; }
  .promo .price { display: inline-block; background: var(--yellow); color: var(--ink); font-weight: 800; border-radius: 10px; padding: 4px 10px; }

  /* Вкладки категорий */
  .tabs { position: sticky; top: 0; z-index: 20; background: var(--bg); display: flex; gap: 8px; overflow-x: auto;
    padding: 12px 16px; scrollbar-width: none; border-bottom: 1px solid transparent; transition: border-color .2s; }
  .tabs.stuck { border-bottom-color: var(--line); box-shadow: 0 6px 14px rgba(0,0,0,.04); }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; background: #fff; font-weight: 700; font-size: 15px;
    border: 1.5px solid var(--line); white-space: nowrap; }
  .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* Меню */
  .cat { scroll-margin-top: 70px; }
  .cat h2 { font-size: 22px; font-weight: 800; margin: 18px 16px 10px; }
  .items { display: grid; gap: 12px; padding: 0 16px; }
  .item { display: flex; gap: 12px; background: var(--card); border-radius: var(--radius); padding: 12px; box-shadow: 0 2px 10px rgba(80,50,0,.06); }
  .pic { flex: none; width: 96px; height: 96px; border-radius: 14px; display: grid; place-items: center; font-size: 52px;
    background: radial-gradient(circle at 30% 25%, #FFE38A 0%, var(--yellow) 45%, var(--orange) 100%); }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .name { font-weight: 800; font-size: 16px; line-height: 1.25; }
  .desc { color: var(--ink-2); font-size: 13.5px; margin: 4px 0 8px; line-height: 1.35; }
  .row { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cost { font-weight: 800; font-size: 17px; }
  .add { min-width: 44px; height: 44px; border-radius: 12px; background: var(--yellow); font-size: 24px; font-weight: 800; line-height: 1; }
  .add:active { transform: scale(.95); }
  .qty { display: inline-flex; align-items: center; background: var(--ink); color: #fff; border-radius: 12px; height: 44px; }
  .qty button { width: 44px; height: 44px; font-size: 22px; font-weight: 800; color: #fff; }
  .qty span { min-width: 22px; text-align: center; font-weight: 800; }

  .info-block { margin: 26px 16px 0; background: #fff; border-radius: var(--radius); padding: 16px; font-size: 15px; }
  .info-block p { margin: 0 0 8px; }
  .info-block a { color: var(--orange-dark); font-weight: 700; text-decoration: none; }
  .demo-note { text-align: center; color: var(--ink-2); font-size: 12px; margin: 18px 16px 0; }

  /* Нижняя панель корзины */
  .cartbar { position: fixed; left: 50%; transform: translate(-50%, 140%); bottom: calc(12px + var(--safe-b)); width: calc(100% - 24px); max-width: 456px;
    z-index: 30; background: var(--ink); color: #fff; border-radius: 18px; min-height: 60px; padding: 0 18px;
    display: flex; align-items: center; justify-content: space-between; font-weight: 800; box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transition: transform .25s ease; }
  .cartbar.show { transform: translate(-50%, 0); }
  .cartbar .count { background: var(--yellow); color: var(--ink); border-radius: 999px; padding: 2px 10px; margin-right: 8px; }

  /* Шторка оформления */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 480px; z-index: 50; background: #fff;
    border-radius: 24px 24px 0 0; max-height: 92vh; display: flex; flex-direction: column;
    transform: translate(-50%, 105%); transition: transform .28s ease; }
  .sheet.show { transform: translate(-50%, 0); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 6px; }
  .sheet-head h3 { margin: 0; font-size: 21px; }
  .grabber { width: 40px; height: 5px; border-radius: 3px; background: #DDD; margin: 8px auto 0; }
  .close { width: 44px; height: 44px; border-radius: 12px; background: #F3F3F3; font-size: 20px; }
  .sheet-body { overflow-y: auto; padding: 4px 16px 16px; }
  .line { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F1F1F1; }
  .line .l-name { flex: 1; font-weight: 700; font-size: 15px; }
  .line .l-sum { font-weight: 800; min-width: 70px; text-align: right; }
  .line .qty { height: 38px; }
  .line .qty button { width: 38px; height: 38px; font-size: 20px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: #F3F3F3; border-radius: 14px; padding: 4px; margin: 16px 0 12px; }
  .seg button { min-height: 44px; border-radius: 11px; font-weight: 700; }
  .seg button.on { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .field { display: block; margin-bottom: 10px; }
  .field span { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 4px; }
  .field input, .field textarea { width: 100%; min-height: 48px; border: 1.5px solid #E6E6E6; border-radius: 12px; padding: 12px; font-size: 16px; background: #FAFAFA; }
  .field textarea { min-height: 70px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--orange); background: #fff; }
  .total { display: flex; justify-content: space-between; font-size: 19px; font-weight: 800; margin: 14px 0 4px; }
  .sheet-foot { padding: 10px 16px calc(14px + var(--safe-b)); border-top: 1px solid #F1F1F1; }
  .send { width: 100%; min-height: 56px; border-radius: 16px; background: var(--wa); color: #fff; font-weight: 800; font-size: 17px;
    display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
  .send[aria-disabled="true"] { opacity: .5; pointer-events: none; }
  .hint { font-size: 12.5px; color: var(--ink-2); text-align: center; margin-top: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">

  <header class="hero">
    <h1 class="logo">Dam<span>Day</span></h1>
    <p class="tagline" id="tagline"></p>
    <div class="meta">
      <span class="pill">★ <b id="rating"></b></span>
      <span class="pill" id="openPill"></span>
      <a class="pill" id="addressLink" target="_blank" rel="noopener">📍 <span id="address"></span></a>
    </div>
    <div class="hero-actions">
      <a class="btn btn-dark" href="#menu">🍔 Меню</a>
      <a class="btn btn-light" id="callBtn">📞 Позвонить</a>
    </div>
  </header>

  <h2 class="section-title">Акции</h2>
  <div class="promos" id="promos"></div>

  <nav class="tabs" id="tabs" aria-label="Категории меню"></nav>
  <main id="menu"></main>

  <section class="info-block">
    <p><b>Адрес:</b> <span id="address2"></span></p>
    <p><b>Часы работы:</b> <span id="hours"></span></p>
    <p><a id="instaLink" target="_blank" rel="noopener">Instagram</a></p>
  </section>
  <p class="demo-note">Демо-версия сайта для DamDay</p>
</div>

<button class="cartbar" id="cartbar" type="button" aria-label="Открыть корзину">
  <span><span class="count" id="cartCount">0</span>Корзина</span>
  <span id="cartSum">0 ₸</span>
</button>

<div class="overlay" id="overlay"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grabber"></div>
  <div class="sheet-head">
    <h3 id="sheetTitle">Ваш заказ</h3>
    <button class="close" id="closeSheet" type="button" aria-label="Закрыть">✕</button>
  </div>
  <div class="sheet-body">
    <div id="lines"></div>
    <div class="seg" role="tablist">
      <button type="button" data-mode="pickup" class="on">🏃 Самовывоз</button>
      <button type="button" data-mode="delivery">🛵 Доставка</button>
    </div>
    <label class="field" id="addressField" hidden><span>Адрес доставки</span>
      <input id="fAddress" autocomplete="street-address" placeholder="Улица, дом, квартира"></label>
    <label class="field"><span>Ваше имя</span>
      <input id="fName" autocomplete="given-name" placeholder="Как к вам обращаться"></label>
    <label class="field"><span>Комментарий</span>
      <textarea id="fComment" placeholder="Без лука, побольше соуса…"></textarea></label>
    <div class="total"><span>Итого</span><span id="total">0 ₸</span></div>
  </div>
  <div class="sheet-foot">
    <a class="send" id="sendBtn" target="_blank" rel="noopener">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .3-3.4-.7-2.9-1.2-4.7-4.1-4.9-4.3-.1-.2-1.2-1.6-1.2-3s.8-2.2 1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.5.5c-.2.2-.3.4-.1.7.2.4.9 1.4 1.9 2.3 1.3 1.1 2.3 1.5 2.7 1.6.3.2.5.1.7-.1l1-1.2c.2-.3.5-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.8-.2 1.5Z"/></svg>
      Отправить заказ в WhatsApp
    </a>
    <p class="hint">Откроется WhatsApp с готовым заказом — останется нажать «Отправить»</p>
  </div>
</section>

// ============================================================
//  Дальше код сайта — менять не нужно
// ============================================================
const $ = (s) => document.querySelector(s);
const money = (n) => n.toLocaleString('ru-RU') + ' ₸';
const items = Object.fromEntries(CONFIG.menu.flatMap((c) => c.items).map((i) => [i.id, i]));

// Корзина: { id: количество }, сохраняется между перезагрузками.
let cart = {};
try { cart = JSON.parse(localStorage.getItem('damday-cart') || '{}') || {}; } catch (e) { cart = {}; }
for (const id of Object.keys(cart)) if (!items[id] || !(cart[id] > 0)) delete cart[id];
let mode = 'pickup';

function saveCart() { try { localStorage.setItem('damday-cart', JSON.stringify(cart)); } catch (e) { /* приватный режим */ } }

// ---- Шапка и инфо ----
$('#tagline').textContent = CONFIG.tagline;
$('#rating').textContent = CONFIG.rating;
$('#address').textContent = CONFIG.address.split(',')[0];
$('#address2').textContent = CONFIG.address;
$('#addressLink').href = CONFIG.mapUrl;
$('#callBtn').href = 'tel:' + CONFIG.phone;
$('#hours').textContent = CONFIG.hours.text;
$('#instaLink').href = CONFIG.instagram;

function openStatus() {
  // По часам телефона посетителя: сайт открывают местные жители.
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const [o, c] = CONFIG.hours.days[now.getDay()].map((t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; });
  const open = c > o ? mins >= o && mins < c : mins >= o || mins < c;
  const pill = $('#openPill');
  pill.className = 'pill ' + (open ? 'open' : 'closed');
  pill.innerHTML = open ? '<b>● Открыто</b>' : '<b>● Закрыто</b>';
}
openStatus();
setInterval(openStatus, 60000);

// ---- Акции ----
const slug = (i) => 'cat-' + i;
const catIndex = (name) => CONFIG.menu.findIndex((c) => c.cat === name);
$('#promos').innerHTML = CONFIG.promos.map((p) => `
  <button class="promo" type="button" ${catIndex(p.target) >= 0 ? `data-target="${slug(catIndex(p.target))}"` : ''}>
    <h3>${p.title}</h3><p>${p.text}</p><span class="price">${p.price}</span>
    <span class="emoji" aria-hidden="true">${p.emoji}</span>
  </button>`).join('');

// ---- Меню и вкладки ----
const COLORS = {
  orange: ['#FFE38A', '#FFC21A', '#FF8A00'],
  peach: ['#FFF0DC', '#FFD3A1', '#FFA35C'],
  red: ['#FFD2C2', '#FF8B6A', '#E84A2F'],
  sky: ['#E3F4FF', '#A9DBFF', '#5DB4F0'],
  pink: ['#FFE6F0', '#FFB3D1', '#F27AAE'],
  lemon: ['#FFF8C9', '#FFE46B', '#F5C000'],
  coffee: ['#F3E2CF', '#D7B48F', '#9C6B42'],
};
const picBg = (color) => { const [a, b, c] = COLORS[color] || COLORS.orange; return `background: radial-gradient(circle at 30% 25%, ${a} 0%, ${b} 45%, ${c} 100%)`; };
$('#tabs').innerHTML = CONFIG.menu.map((c, i) => `<button class="tab" type="button" data-target="${slug(i)}">${c.cat}</button>`).join('');
$('#menu').innerHTML = CONFIG.menu.map((c, i) => `
  <section class="cat" id="${slug(i)}">
    <h2>${c.cat}</h2>
    <div class="items">${c.items.map((it) => `
      <article class="item">
        <div class="pic" style="${picBg(c.color)}" aria-hidden="true">${it.emoji}</div>
        <div class="info">
          <div class="name">${it.name}</div>
          <div class="desc">${it.desc || ''}</div>
          <div class="row"><span class="cost">${money(it.price)}</span><span class="ctrl" data-id="${it.id}"></span></div>
        </div>
      </article>`).join('')}
    </div>
  </section>`).join('');

function ctrlHtml(id) {
  const q = cart[id] || 0;
  return q
    ? `<span class="qty"><button type="button" data-dec="${id}" aria-label="Убрать">−</button><span>${q}</span><button type="button" data-inc="${id}" aria-label="Добавить">+</button></span>`
    : `<button class="add" type="button" data-inc="${id}" aria-label="Добавить ${items[id].name}">+</button>`;
}

function render() {
  document.querySelectorAll('.ctrl').forEach((el) => { el.innerHTML = ctrlHtml(el.dataset.id); });
  const ids = Object.keys(cart);
  const count = ids.reduce((s, id) => s + cart[id], 0);
  const sum = ids.reduce((s, id) => s + cart[id] * items[id].price, 0);
  $('#cartCount').textContent = count;
  $('#cartSum').textContent = money(sum);
  $('#cartbar').classList.toggle('show', count > 0);
  $('#total').textContent = money(sum);
  $('#lines').innerHTML = ids.length
    ? ids.map((id) => `<div class="line"><span class="l-name">${items[id].name}</span>${ctrlHtml(id)}<span class="l-sum">${money(cart[id] * items[id].price)}</span></div>`).join('')
    : '<p style="color:var(--ink-2)">Корзина пуста — добавьте что-нибудь вкусное 🙂</p>';
  updateSend();
  if (!count) closeSheet();
}

document.addEventListener('click', (e) => {
  const inc = e.target.closest('[data-inc]');
  const dec = e.target.closest('[data-dec]');
  if (inc) { const id = inc.dataset.inc; cart[id] = (cart[id] || 0) + 1; saveCart(); render(); }
  if (dec) { const id = dec.dataset.dec; cart[id] -= 1; if (cart[id] <= 0) delete cart[id]; saveCart(); render(); }
  const jump = e.target.closest('.tab, .promo[data-target]');
  if (jump) document.getElementById(jump.dataset.target).scrollIntoView({ block: 'start' });
});

// Подсветка вкладки текущего раздела и тень у липкой панели.
const tabsEl = $('#tabs');
function onScroll() {
  tabsEl.classList.toggle('stuck', tabsEl.getBoundingClientRect().top <= 0);
  let current = 0;
  CONFIG.menu.forEach((c, i) => { if (document.getElementById(slug(i)).getBoundingClientRect().top < 120) current = i; });
  tabsEl.querySelectorAll('.tab').forEach((t, i) => {
    const on = i === current;
    if (on && !t.classList.contains('active')) t.scrollIntoView({ inline: 'center', block: 'nearest' });
    t.classList.toggle('active', on);
  });
}
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();

// ---- Шторка оформления ----
function openSheet() { $('#overlay').classList.add('show'); $('#sheet').classList.add('show'); document.body.style.overflow = 'hidden'; }
function closeSheet() { $('#overlay').classList.remove('show'); $('#sheet').classList.remove('show'); document.body.style.overflow = ''; }
$('#cartbar').addEventListener('click', openSheet);
$('#overlay').addEventListener('click', closeSheet);
$('#closeSheet').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
  mode = b.dataset.mode;
  document.querySelectorAll('.seg button').forEach((x) => x.classList.toggle('on', x === b));
  $('#addressField').hidden = mode !== 'delivery';
  updateSend();
}));
['#fAddress', '#fName', '#fComment'].forEach((s) => $(s).addEventListener('input', updateSend));

function orderText() {
  const ids = Object.keys(cart);
  const sum = ids.reduce((s, id) => s + cart[id] * items[id].price, 0);
  const lines = ids.map((id) => `• ${items[id].name} × ${cart[id]} — ${money(cart[id] * items[id].price)}`);
  const name = $('#fName').value.trim();
  const addr = $('#fAddress').value.trim();
  const comment = $('#fComment').value.trim();
  return [
    `Здравствуйте! Хочу сделать заказ в ${CONFIG.name}:`,
    '',
    ...lines,
    '',
    `Итого: ${money(sum)}`,
    mode === 'delivery' ? `Доставка: ${addr || '(адрес не указан)'}` : 'Самовывоз',
    name ? `Имя: ${name}` : null,
    comment ? `Комментарий: ${comment}` : null,
  ].filter((x) => x !== null).join('\n');
}

function updateSend() {
  const btn = $('#sendBtn');
  const empty = !Object.keys(cart).length;
  const needAddr = mode === 'delivery' && !$('#fAddress').value.trim();
  btn.setAttribute('aria-disabled', String(empty || needAddr));
  btn.href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(orderText())}`;
  $('.hint').textContent = needAddr ? 'Укажите адрес доставки' : 'Откроется WhatsApp с готовым заказом — останется нажать «Отправить»';
}

render();
</script>
